<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jokelingo</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="icon" href="{% static 'images/favicon.ico' %}">
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-left">
            <h1>Jokelingo</h1>
            <p>Learn a new language while having fun</p>
        </div>
        <div class="top-bar-right">
            <div class="header-badge">Spanish → English</div>
        </div>
    </div>
    
    <div class="container">
        
        <div id="error" style="display: none;" class="error"></div>
        
        <div id="loading" class="loading" style="display: none;">Loading feed...</div>
        
        <div id="postsContainer" class="posts-container"></div>
        
        <div id="pagination" class="pagination" style="display: none;"></div>
    </div>
    
    <script>
        let currentCursor = null;
        let currentParams = {};
        
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const postsContainer = document.getElementById('postsContainer');
        const pagination = document.getElementById('pagination');
        
        function showLoading(append = false) {
            loading.style.display = 'block';
            error.style.display = 'none';
            if (!append) {
                postsContainer.innerHTML = '';
            }
            pagination.style.display = 'none';
        }
        
        function hideLoading() {
            loading.style.display = 'none';
        }
        
        function showError(message) {
            error.textContent = message;
            error.style.display = 'block';
            hideLoading();
        }
        
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString();
        }
        
        function renderPost(post) {
            return `
                <div class="post-card">
                    <div class="post-embed" id="embed-${post.id}">
                        <div class="provider-badge">${post.source.provider}</div>
                        <div class="embed-loading">Loading embedded post...</div>
                    </div>
                    <div class="post-contribution">
                        ${post.contribution?.translation?.text ? `
                            <h4>Translation</h4>
                            <div class="translation">${post.contribution.translation.text}</div>
                        ` : ''}
                        ${post.contribution?.explanation?.text ? `
                            <h4>Explanation</h4>
                            <div class="explanation">${post.contribution.explanation.text}</div>
                        ` : ''}
                    </div>
                    <div class="post-engagement">
                        <div class="engagement-item helpful">
                            <span>👍</span>
                            <span>${post.engagement.helpful} helpful</span>
                        </div>
                        <div class="engagement-item confusing">
                            <span>😕</span>
                            <span>${post.engagement.confusing} confusing</span>
                        </div>
                    </div>
                    <div class="post-author">
                        By <strong>${post.author.display_name}</strong> (${post.author.id}) • ${formatDate(post.created_at)}
                    </div>
                </div>
            `;
        }
        
        async function loadFeed(params = {}, cursor = null, append = false) {
            showLoading(append);
            
            const queryParams = new URLSearchParams();
            if (params.limit) queryParams.append('limit', params.limit);
            if (params.source_language_code) queryParams.append('source_language_code', params.source_language_code);
            if (params.target_language_code) queryParams.append('target_language_code', params.target_language_code);
            if (cursor) queryParams.append('cursor', cursor);
            
            try {
                const response = await fetch(`/api/v1/feed?${queryParams.toString()}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                // Render posts
                if (data.posts && data.posts.length > 0) {
                    if (append) {
                        // Append new posts to existing ones
                        const postsHTML = data.posts.map(renderPost).join('');
                        postsContainer.insertAdjacentHTML('beforeend', postsHTML);
                        // Embed posts after rendering
                        data.posts.forEach(post => {
                            embedPost(post);
                        });
                    } else {
                        // Replace all posts (initial load)
                        postsContainer.innerHTML = data.posts.map(renderPost).join('');
                        // Embed posts after rendering
                        data.posts.forEach(post => {
                            embedPost(post);
                        });
                    }
                } else {
                    if (!append) {
                        postsContainer.innerHTML = '<div class="post-card"><p>No posts found.</p></div>';
                    }
                }
                
                // Handle pagination
                currentCursor = data.meta.next_cursor || null;
                if (data.meta.has_more && currentCursor) {
                    pagination.innerHTML = `
                        <button class="btn" onclick="loadNextPage()">Load More</button>
                    `;
                    pagination.style.display = 'block';
                } else {
                    pagination.style.display = 'none';
                }
                
                hideLoading();
            } catch (err) {
                showError(`Error loading feed: ${err.message}`);
            }
        }
        
        function embedPost(post) {
            const embedContainer = document.getElementById(`embed-${post.id}`);
            if (!embedContainer) return;
            
            const provider = post.source.provider.toLowerCase();
            const url = post.source.canonical_url;
            
            // Clear loading message
            const loadingDiv = embedContainer.querySelector('.embed-loading');
            
            if (provider === 'reddit') {
                // Reddit embed using iframe - using larger height to minimize scrolling
                const redditEmbedUrl = url.replace('www.reddit.com', 'embed.reddit.com') + '?embed=true';
                const wrapper = document.createElement('div');
                wrapper.style.textAlign = 'center';
                wrapper.style.width = '100%';
                const iframe = document.createElement('iframe');
                iframe.src = redditEmbedUrl;
                iframe.style.width = '600px';
                iframe.style.maxWidth = '100%';
                iframe.style.height = '1000px'; // Large height to fit most Reddit posts
                iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups');
                iframe.setAttribute('scrolling', 'no');
                iframe.onload = () => {
                    if (loadingDiv) loadingDiv.remove();
                };
                iframe.onerror = () => {
                    if (loadingDiv) {
                        loadingDiv.className = 'embed-error';
                        loadingDiv.textContent = 'Unable to load Reddit embed.';
                    }
                };
                wrapper.appendChild(iframe);
                if (loadingDiv) loadingDiv.remove();
                embedContainer.appendChild(wrapper);
            } else if (provider === 'instagram') {
                // Instagram embed using blockquote (works with their embed.js)
                const wrapper = document.createElement('div');
                wrapper.style.textAlign = 'center';
                wrapper.style.width = '100%';
                const blockquote = document.createElement('blockquote');
                blockquote.className = 'instagram-media';
                blockquote.setAttribute('data-instgrm-captioned', '');
                blockquote.setAttribute('data-instgrm-permalink', url);
                blockquote.setAttribute('data-instgrm-version', '14');
                blockquote.style.background = '#FFF';
                blockquote.style.border = '0';
                blockquote.style.borderRadius = '3px';
                blockquote.style.margin = '0 auto';
                blockquote.style.padding = '0';
                blockquote.style.display = 'block';
                
                if (loadingDiv) loadingDiv.remove();
                wrapper.appendChild(blockquote);
                embedContainer.appendChild(wrapper);
                
                // Load Instagram embed script if not already loaded
                if (!window.instgrm) {
                    const script = document.createElement('script');
                    script.src = 'https://www.instagram.com/embed.js';
                    script.async = true;
                    document.body.appendChild(script);
                } else {
                    window.instgrm.Embeds.process();
                }
            } else if (provider === 'twitter') {
                // Twitter embed using blockquote (works with their widgets.js)
                const wrapper = document.createElement('div');
                wrapper.style.textAlign = 'center';
                wrapper.style.width = '100%';
                const blockquote = document.createElement('blockquote');
                blockquote.className = 'twitter-tweet';
                blockquote.setAttribute('data-theme', 'light');
                const link = document.createElement('a');
                link.href = url;
                blockquote.appendChild(link);
                
                if (loadingDiv) loadingDiv.remove();
                wrapper.appendChild(blockquote);
                embedContainer.appendChild(wrapper);
                
                // Load Twitter embed script if not already loaded
                if (!window.twttr) {
                    const script = document.createElement('script');
                    script.src = 'https://platform.twitter.com/widgets.js';
                    script.async = true;
                    script.charset = 'utf-8';
                    script.id = 'twitter-wjs';
                    script.onload = () => {
                        if (window.twttr && window.twttr.widgets) {
                            window.twttr.widgets.load();
                        }
                    };
                    document.body.appendChild(script);
                } else {
                    window.twttr.widgets.load();
                }
            } else {
                // Fallback: show link
                if (loadingDiv) {
                    loadingDiv.className = 'embed-error';
                    loadingDiv.innerHTML = `Embedding not available for ${provider}. <a href="${url}" target="_blank" rel="noopener noreferrer">View original post</a>`;
                }
            }
        }
        
        function loadNextPage() {
            loadFeed(currentParams, currentCursor, true); // true = append mode
        }
        
        // Load initial feed on page load
        window.addEventListener('DOMContentLoaded', () => {
            currentParams = {
                limit: '10',
                source_language_code: 'es_ES',
                target_language_code: 'en_US',
            };
            loadFeed(currentParams);
        });
    </script>
</body>
</html>
