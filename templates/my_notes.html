<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>My Notes - Jokelingo</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="icon" href="{% static 'images/favicon.ico' %}">
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-left">
            <h1><a href="/">Jokelingo</a></h1>
            <p>Learn a new language while having fun</p>
        </div>
        <div class="top-bar-right">
            {% if user.is_authenticated %}
                <div class="user-menu-container">
                    <div class="user-display-name" id="userMenuTrigger">{{ user.display_name }}</div>
                    <div class="user-menu-dropdown" id="userMenuDropdown">
                        <a href="/me/notes/" class="user-menu-item">My Notes</a>
                        <a href="/accounts/logout/" class="user-menu-item">Logout</a>
                    </div>
                </div>
            {% else %}
                <button class="login-btn" id="loginBtn">Login</button>
            {% endif %}
        </div>
    </div>
    
    <div class="container">
        <div class="page-header" style="margin-bottom: 20px;">
            <h2 style="margin: 0; color: #2d3748;">My Notes</h2>
            <p style="margin: 10px 0 0 0; color: #4a5568;">Posts you've marked as helpful</p>
        </div>
        
        <div id="error" style="display: none;" class="error"></div>
        
        <div id="loading" class="loading" style="display: none;">Loading notes...</div>
        
        <div id="postsContainer" class="posts-container"></div>
        
        <div id="pagination" class="pagination" style="display: none;"></div>
    </div>
    
    {% load static %}
    <script src="{% static 'js/common.js' %}"></script>
    <script src="{% static 'js/my_notes.js' %}"></script>
    <script>
        // Initialize the page with Django template variables
        initMyNotesPage({
            isAuthenticated: {% if user.is_authenticated %}true{% else %}false{% endif %}
        });
    </script>
</body>
</html>
